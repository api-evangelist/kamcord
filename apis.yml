name: Kamcord
description: 'Kamcord was a San Francisco-based mobile technology company (Y Combinator,
  Summer 2012) founded by Aditya Rathnam, Kevin Wang, and Matt Zitzmann. It offered an iOS and
  Android SDK that let game developers embed in-app gameplay recording, live streaming ("appcasting"),
  and social sharing to YouTube, Twitter, and Facebook, and grew to roughly 200 million device installs.
  The company later pivoted to a short-form mobile screen-content social network ("shots"). In November
  2017 Lyft acquihired most of the ~15-person team, including co-founders Rathnam and Wang, and Kamcord
  wound down its consumer app, live streaming, and developer SDK by the end of 2017. The company is
  DEFUNCT and no longer operates any developer program or API. The kamcord.com domain has since been
  repurposed by an unrelated lifestyle/blog publisher and is NOT associated with the original Kamcord.'
